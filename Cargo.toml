[workspace]
resolver = "3"
members = [
  "protocol",
  "reporter",
  "playwright",
  "client",
  "server",
  "xtask",
  "e2e",
]
default-members = ["server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/luapenguin/kat0-pipeline"
readme = "README.md"

[workspace.dependencies]
kat0-pipeline-protocol = { path = "protocol", version = "0.1.0" }
kat0-pipeline-reporter = { path = "reporter", version = "0.1.0" }
kat0-pipeline-playwright = { path = "playwright", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
leptos = { version = "=0.8.20", default-features = false }
tempfile = "3"

[[workspace.metadata.leptos]]
name = "kat0-pipeline"
bin-package = "kat0-pipeline"
lib-package = "kat0-pipeline-client"
bin-target = "kat0-pipeline"
output-name = "kat0-pipeline"
site-root = "target/pipeline-site"
site-pkg-dir = "pkg"
front-target-dir = "target/pipeline-front"
style-file = "client/report.css"
hash-files = false
