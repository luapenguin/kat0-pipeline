[package]
name = "kat0-pipeline-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
kat0-pipeline-protocol.workspace = true
gloo-net = { version = "0.6", default-features = false, features = [
  "http",
  "json",
] }
leptos = { workspace = true, features = ["csr"] }
leptos-node-graph = "=0.2.2"
leptos-use = { version = "=0.19.0", default-features = false, features = [
  "use_element_size",
] }
serde_json.workspace = true
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = [
  "Document",
  "Element",
  "Event",
  "EventSource",
  "HtmlElement",
  "KeyboardEvent",
  "MessageEvent",
  "Window",
] }
